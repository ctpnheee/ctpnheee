name: Contribution snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c2185b&color_dots=#f3eef8,#e9c6f0,#d39be3,#b06fd0,#8e44ad
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff8fc7&color_dots=#21262d,#4a2f63,#7b4ba3,#b57be0,#f0b3ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
